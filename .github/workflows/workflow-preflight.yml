name: Workflow Preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cron-scenario.yml
      - .github/workflows/workflow-preflight.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/cron-scenario.yml
      - .github/workflows/workflow-preflight.yml

jobs:
  validate-cron-workflow:
    name: Validate cron workflow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          python -m pip install yamllint

      - name: Validate GitHub Actions workflow syntax
        run: |
          ACTIONLINT_VERSION=1.7.7
          curl -sSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color .github/workflows/cron-scenario.yml

      - name: Validate YAML formatting
        run: |
          yamllint -d '{extends: default, rules: {truthy: disable, document-start: disable, line-length: {max: 400, level: error}}}' .github/workflows/cron-scenario.yml

      - name: Guard MySQL quoting in workflow commands
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

            workflow = pathlib.Path('.github/workflows/cron-scenario.yml')
          # mysql -e with double-quoted SQL must not include backticked identifiers
          # because nested shells can treat backticks as command substitution.
          pattern = re.compile(r'mysql[^\n]*\s-e\s"[^"\n]*`[^"\n]*"')

          violations = []
            text = workflow.read_text()
            for match in pattern.findall(text):
              violations.append((str(workflow), match))

          if violations:
              print(
                  'Unsafe mysql quoting detected: backticks inside double-quoted -e SQL.',
                  file=sys.stderr,
              )
              print("Use single-quoted SQL: -e 'SELECT ... `#table` ...'", file=sys.stderr)
              for idx, (wf, snippet) in enumerate(violations, start=1):
                  print(f'{idx}. {wf}: {snippet}', file=sys.stderr)
              sys.exit(1)

          print('MySQL quoting guard passed.')
          PY
