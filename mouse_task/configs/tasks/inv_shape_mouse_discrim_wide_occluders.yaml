class_name: InvShapeDiscWideOccludersTask
description: |
  Shape discrimination task,  with occluders on, intermediate level for learning.
  The mouse must report the location of the black teardrop object and ignore the wide Pacman.

# Only the parameters that differ from configs/common.yaml.
params:
  session_label:
  - ar_shape_discrim_wide_occluders_inv
  epoch_labels:
  - teardrop_vs_pacman
  slit_size:
  - 8.0
  - 12.0
  - 2
  slit_depth: 0.02
  target_selection: 5.0
  distractor_selection: 11.0
  occlusion_type: 1.0
  target_rotation: 15.0
  target_spread: 3.0
  target_distance: 4.0